version: "3.8"

services:
  gateway:
    build: .
    container_name: whatsapp_gateway_core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - API_SECRET_KEY=sua_chave_mestra_secreta_aqui
      - DEFAULT_WEBHOOK_URL=http://host.docker.internal:3000/webhook
    volumes:
      - ./sessions:/app/sessions
      - ./temp:/app/temp
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"

  # Redis para barramento de eventos (opcional se usar pub/sub distribuído)
  redis:
    image: redis:7-alpine
    container_name: whatsapp_gateway_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
